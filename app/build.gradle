plugins {
    id 'com.android.application'
}

android {
    namespace 'com.m19.hdrtoggle'
    compileSdk 33

    defaultConfig {
        applicationId "com.m19.hdrtoggle"
        minSdk 21
        targetSdk 28 // 目标 API 设为 28 避免高版本沙盒限制局域网明文 Socket
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // 直接使用 debug 签名方便开箱即装
        }
    }
}

dependencies {
    // 将 io.github 更改为 com.github，版本使用 master-SNAPSHOT 确保能从 JitPack 直接拉取
    implementation 'com.github.cgutman:adblib:master-SNAPSHOT'
}
