name: Build TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 赋予 Gradle 执行权限
      run: chmod +x gradlew

    - name: 编译 Release APK
      run: ./gradlew assembleRelease

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: M19-HDR-Toggle
        path: app/build/outputs/apk/release/*.apk
